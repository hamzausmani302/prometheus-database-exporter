  - name: id3_ddr_sensors_coverage
    dataSource: id3_dashboard
    query: "select r.well_name, r.well_id, r.ddr_sensors_coverage ,r.rig_name from ( select *,ROW_NUMBER() OVER (PARTITION BY t.id_t_well ORDER BY top.start_date desc) as rig_no from ( select tw.id_t_well, tw.well_name, tw.well_id, coalesce(sum(td.t_mudlog_row_count*5)/sum(td.duration_sec)::numeric, 0) as ddr_sensors_coverage from t_well tw left join t_ddr td on tw.id_t_well = td.id_t_well where is_live is true and to_load is true group by tw.id_t_well, tw.well_name, tw.well_id ) t left join (select * from t_operation top1 join t_rig tr on top1.id_t_rig = tr.id_t_rig ) top on t.id_t_well = top.id_t_well ) r where r.rig_no = 1"
    queryRefreshTime: 180
    queryTimeout: 30
    labels:
      - name: well_id
        columnName: well_id
      - name: rig_name
        columnName: rig_name
      - name: well_name
        columnName: well_name
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: ddr_sensors_coverage
        type: GAUGE
        help: "the coverage of sensors over ddr, sensors duration / ddr duration computed over ddr rows"
        column: ddr_sensors_coverage

  - name: id3_phase_sensors_coverage
    dataSource: id3_dashboard
    query: "select r.well_name, r.well_id , r.phase_sensors_coverage, r.rig_name from ( select *, ROW_NUMBER() OVER (PARTITION BY t.id_t_well ORDER BY top.start_date desc) as rig_no from ( select tw.id_t_well, tw.well_name, tw.well_id, coalesce(sum(tp.t_mudlog_row_count*5)/sum(case when ts_end_utc is null then extract(epoch from now() at time zone 'utc' - ts_start_utc) else extract(epoch from ts_end_utc - ts_start_utc) end)::numeric, 0) as phase_sensors_coverage from t_well tw left join t_phase tp on tw.id_t_well = tp.id_t_well where is_live is true and to_load is true group by tw.well_name, tw.well_id, tw.id_t_well ) t left join (select * from t_operation top1 join t_rig tr on top1.id_t_rig = tr.id_t_rig ) top on t.id_t_well = top.id_t_well ) r where r.rig_no = 1"
    queryRefreshTime: 180
    queryTimeout: 30
    labels:
