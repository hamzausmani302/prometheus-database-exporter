  - name: id3_computation_delay
    dataSource: id3_dashboard
    query: "select t.well_name, t.well_id, t.computation_profile, t.computation_seconds_delay, t.rig_name from ( select tw.well_name, tw.id_t_well,top.rig_name, tw.well_id, twc.computation_profile, extract(epoch from now() at time zone 'utc' - twc.last_computation_run_utc) as computation_seconds_delay , ROW_NUMBER() OVER (PARTITION BY tw.id_t_well , twc.computation_profile ORDER BY top.start_date desc) as rig_no from t_well tw left join t_well_computational_stats twc on tw.id_t_well = twc.id_t_well left join (select * from t_operation top1 join t_rig tr on top1.id_t_rig = tr.id_t_rig ) top on tw.id_t_well = top.id_t_well where is_live is true and to_load is true ) t where t.rig_no = 1"
    queryRefreshTime: 60
    queryTimeout: 30
    labels:
      - name: well_id
        columnName: well_id
      - name: well_name
        columnName: well_name
      - name: rig_name
        columnName: rig_name
      - name: computation_profile
        columnName: computation_profile
      - name: database_name
