    metrics:
      - name: computation_seconds_delay
        type: GAUGE
        help: "computation delay in seconds"
        column: computation_seconds_delay

  - name: id3_unrecognized_casing
    dataSource: id3_dashboard
    query: "select r.well_name, r.well_id , r.unrecognized_casings , r.rig_name from ( select ROW_NUMBER() OVER (PARTITION BY t.id_t_well ORDER BY top.start_date desc) as rig_no ,top.rig_name , t.* from ( select tw.id_t_well, tw.well_name, tw.well_id, count(tc.id_t_casing) as unrecognized_casings from t_well tw left join t_casing tc on tw.id_t_well = tc.id_t_well and (tc.ts_start_utc is null or tc.ts_end_utc is null) where is_live is true and to_load is true group by tw.well_name, tw.well_id, tw.id_t_well ) t left join (select * from t_operation top1 join t_rig tr on top1.id_t_rig = tr.id_t_rig ) top on t.id_t_well = top.id_t_well ) r where r.rig_no = 1"
    queryRefreshTime: 180
    queryTimeout: 30
    labels:
      - name: well_id
        columnName: well_id
      - name: well_name
        columnName: well_name
      - name: rig_name
        columnName: rig_name
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: unrecognized_casings
        type: GAUGE
        help: "the number of unrecognized casings"
        column: unrecognized_casings

  - name: id3_unrecognized_merged_phases
    dataSource: id3_dashboard
    query: "select r.well_name, r.well_id, r.unrecognized_merged_phases , r.rig_name from ( select *, ROW_NUMBER() OVER (PARTITION BY t.id_t_well ORDER BY top.start_date desc) as rig_no from ( select tw.id_t_well , tw.well_name, tw.well_id, count(tp.id_t_phase) as unrecognized_merged_phases from t_well tw left join t_phase tp on tw.id_t_well = tp.id_t_well and tp.id_t_phase_merged is null where is_live is true and to_load is true group by tw.well_name, tw.well_id, tw.id_t_well ) t left join (select * from t_operation top1 join t_rig tr on top1.id_t_rig = tr.id_t_rig ) top on t.id_t_well = top.id_t_well ) r where r.rig_no = 1"
    queryRefreshTime: 180
    queryTimeout: 30
    labels:
      - name: well_id
        columnName: well_id
      - name: well_name
        columnName: well_name
      - name: rig_name
        columnName: rig_name
      - name: database_name
