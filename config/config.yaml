        password: W1Ni!4oNI!82Wqs!kd8mx0r!
        connectionString: "postgresql://postgres:W1Ni!4oNI!82Wqs!kd8mx0r!@localhost:5434/id3_dashboard"

  - name: orchestrator
    type: SQL
    metadata:
      connectionDetails:
        host: localhost
        port: 5437
        username: postgres
        password: W1Ni!4oNI!82Wqs!kd8mx0r!
        connectionString: "postgresql://postgres:W1Ni!4oNI!82Wqs!kd8mx0r!@localhost:5434/orchestrator"

  - name: id3_benchmarking_kpi
    type: SQL
    metadata:
      connectionDetails:
        host: localhost
        port: 5437
        username: postgres
        password: W1Ni!4oNI!82Wqs!kd8mx0r!
        connectionString: "postgresql://postgres:W1Ni!4oNI!82Wqs!kd8mx0r!@localhost:5434/id3_benchmarking_kpi"

queries:
  - name: id3_mudlog_delay
    dataSource: id3_dashboard
    query: "select well_name, well_id, rig_name, extract(epoch from now() at time zone 'utc' - ts_last_mudlog) as mudlog_seconds_delay from (select tw.well_id, tw.well_name, tw.ts_last_mudlog, ROW_NUMBER() OVER (PARTITION BY tw.id_t_well ORDER BY top.start_date desc) AS rig_order, tr.* from t_well tw left join t_operation top on tw.id_t_well = top.id_t_well left join t_rig tr on tr.id_t_rig = top.id_t_rig where tw.to_load is true and tw.is_live is true) as t where rig_order = 1"
    queryRefreshTime: 60
    queryTimeout: 30
    labels:
      - name: well_id
        columnName: well_id
      - name: rig_name
        columnName: rig_name
      - name: well_name
        columnName: well_name
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: mudlog_seconds_delay
        type: GAUGE
        help: "mudlog delay in seconds"
        column: mudlog_seconds_delay

  - name: id3_ddr_delay
    dataSource: id3_dashboard
    query: "select t.well_name, t.well_id, t.ddr_seconds_delay, top.rig_name from (select t_well.id_t_well, well_name, well_id, case when max(td.ts_end_utc) is not null then extract(epoch from now() at time zone 'utc' - max(td.ts_end_utc)) else null end as ddr_seconds_delay from (select * from t_well where is_live is true and to_load is true) t_well left join t_ddr td on td.id_t_well = t_well.id_t_well group by well_name, well_id, t_well.id_t_well) t left join (select top1.*, tr.* , ROW_NUMBER() OVER (PARTITION BY top1.id_t_well ORDER BY top1.start_date desc) as rig_no from t_operation top1 join t_rig tr on tr.id_t_rig = top1.id_t_rig ) top on top.id_t_well = t.id_t_well where top.rig_no = 1"
    queryRefreshTime: 60
    queryTimeout: 30
    labels:
      - name: well_id
        columnName: well_id
      - name: well_name
        columnName: well_name
      - name: rig_name
        columnName: rig_name
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: ddr_seconds_delay
        type: GAUGE
        help: "ddr delay in seconds"
        column: ddr_seconds_delay

  - name: id3_running_tasks
    dataSource: orchestrator
    query: "SELECT t.run_type as algorithms_profile, coalesce(count(tq.id_task), 0) as running_tasks from task t left join task_queue tq on t.id_task = tq.id_task AND tq.is_running = true group by t.run_type"
    queryRefreshTime: 30
    queryTimeout: 30
    labels:
      - name: algorithms_profile
        columnName: algorithms_profile
      - name: database_name
        staticValue: orchestrator
    metrics:
      - name: running_tasks
        type: GAUGE
        help: "the number of runing tasks"
        column: running_tasks

  - name: id3_queued_tasks
    dataSource: orchestrator
    query: "SELECT t.run_type as algorithms_profile, coalesce(count(tq.id_task), 0) as queued_tasks from task t left join task_queue tq on t.id_task = tq.id_task AND tq.is_running = false group by t.run_type"
    queryRefreshTime: 30
    queryTimeout: 30
    labels:
      - name: algorithms_profile
        columnName: algorithms_profile
      - name: database_name
        staticValue: orchestrator
    metrics:
      - name: queued_tasks
        type: GAUGE
        help: "the number of queued tasks"
        column: queued_tasks

  - name: id3_live_wells
    dataSource: id3_dashboard
    query: "select count(*) as live_wells_count from t_well where is_live is true and to_load is true"
    queryRefreshTime: 60
    queryTimeout: 30
    labels:
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: live_wells_count
        type: GAUGE
        help: "the number of live wells"
        column: live_wells_count

  - name: id3_wells
    dataSource: id3_dashboard
    query: "select count(*) as wells_count from t_well where to_load is true"
    queryRefreshTime: 60
    queryTimeout: 30
    labels:
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: wells_count
        type: GAUGE
        help: "the number of wells"
        column: wells_count

  - name: id3_benchmarking_wells
    dataSource: id3_benchmarking_kpi
    query: "select count(*) as benchmarking_wells_count from external_wells"
    queryRefreshTime: 60
    queryTimeout: 30
    labels:
      - name: database_name
        staticValue: id3_benchmarking
    metrics:
      - name: benchmarking_wells_count
        type: GAUGE
        help: "the number of benchmarking wells"
        column: benchmarking_wells_count

  - name: id3_computations_stats
    dataSource: id3_dashboard
    query: "select t.well_name , t.well_id, t.computation_profile, t.last_computation_duration_sec,last_memory_max_megabyte, t.rig_name from ( select tr.rig_name, ROW_NUMBER() OVER (PARTITION BY top.id_t_well,twc.computation_profile order by top.start_date desc) as rig_no, tw.id_t_well , tw.well_name, tw.well_id, twc.computation_profile, twc.last_computation_duration_sec, twc.last_memory_max_megabyte from t_well tw left join t_well_computational_stats twc on tw.id_t_well = twc.id_t_well left join t_operation top on top.id_t_well = tw.id_t_well left join t_rig tr on top.id_t_rig = tr.id_t_rig where tw.is_live is true and tw.to_load is true ) t where t.rig_no = 1;"
    queryRefreshTime: 60
    queryTimeout: 30
    labels:
      - name: well_id
        columnName: well_id
      - name: well_name
        columnName: well_name
      - name: rig_name
        columnName: rig_name
      - name: computation_profile
        columnName: computation_profile
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: last_computation_duration_sec
        type: GAUGE
        help: "last computation duration in seconds"
        column: last_computation_duration_sec
      - name: last_memory_max_megabyte
        type: GAUGE
        help: "last memory max in megabyte"
        column: last_memory_max_megabyte

  - name: id3_ddr_missing_lv_0
