  - name: id3_stand_missing_length
    dataSource: id3_dashboard
    query: "select r.well_name, r.well_id, r.stand_missing_length, r.rig_name from ( select *, ROW_NUMBER() OVER (PARTITION BY t.id_t_well ORDER BY top.start_date desc) as rig_no from ( select tw.id_t_well, tw.well_name, tw.well_id, tmv.trippped_length as stand_missing_length from t_well tw left join (select id_t_well, sum(abs(ddbtm)) as trippped_length from t_mudlog_mavg where id_t_well in (select id_t_well from t_well where to_load is true and is_live is true) and ddbtm > -15000 * 0.00833 and ddbtm < 15000 * 0.00833 and id_t_stand is null group by id_t_well) tmv on tw.id_t_well = tmv.id_t_well where to_load is true and is_live is true ) t left join (select * from t_operation top1 join t_rig tr on top1.id_t_rig = tr.id_t_rig ) top on t.id_t_well = top.id_t_well ) r where r.rig_no = 1"
    queryRefreshTime: 1800
