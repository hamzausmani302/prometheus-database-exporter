  - name: id3_missing_casing_records
    dataSource: id3_dashboard
    query: |
      select distinct tw.well_name, tw.well_id, 1 as dummy, tw.group_security AS rig_name  from t_casing tc join (select id_t_well , DATE(max(ts_start_utc)) as latest_casing from t_ddr where source_code_level_3 in  ('12.1', '12.1.1', '12.1.2') and ts_start_utc  >= NOW() - interval '7 days' group by id_t_well) dt
      on tc.id_t_well = dt.id_t_well
      join t_well tw
      on tw.id_t_well  = dt.id_t_well
      where DATE(tc.ts_start_utc)  < dt.latest_casing
    queryRefreshTime: 300
    queryTimeout: 30
    labels:
      - name: well_name
        columnName: well_name
      - name: well_id
        columnName: well_id
      - name: rig_name
        columnName: rig_name
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: dummy
        type: GAUGE
        help: "The dummy value to ensure the query returns a result set"
        column: dummy

  # Pipeline query: stage 1 fetches live wells, stage 2 runs per-well gap
  # calculation using {{id_t_well}} substitution.
  - name: id3_total_gap_duration_seconds
    dataSource: id3_dashboard
    queryRefreshTime: 180
    queryTimeout: 60
    pipeline:
      - stageId: t_well
        stageType: extract
        dataSource: id3_dashboard
        query: |
          select t.id_t_well, t.well_name, t.well_id, t.rig_name from (
            select tw.id_t_well, tw.well_name, tw.well_id, top.rig_name,
                   ROW_NUMBER() OVER (PARTITION BY tw.id_t_well ORDER BY top.start_date desc) as rig_no
            from t_well tw
            left join (
              select * from t_operation top1 join t_rig tr on top1.id_t_rig = tr.id_t_rig
            ) top on tw.id_t_well = top.id_t_well
            where to_load and is_live
          ) t
          where t.rig_no = 1

      - stageId: sum_spikes
        stageType: foreach
        dataSource: id3_dashboard
        inputStageIds:
          - t_well
        query: |
          WITH well_data AS (
            SELECT id_t_well, dattim_utc,
                   LEAD(dattim_utc) OVER (ORDER BY dattim_utc) AS next_dattim_utc
            FROM t_mudlog
            WHERE id_t_well = {{id_t_well}}
          ),
          gaps AS (
            SELECT id_t_well, EXTRACT(EPOCH FROM (next_dattim_utc - dattim_utc)) AS gap_seconds
            FROM well_data
            WHERE next_dattim_utc IS NOT NULL
          ),
          filtered_gaps AS (
            SELECT id_t_well, gap_seconds - 5 AS adjusted_gap
            FROM gaps
            WHERE gap_seconds > 5
          )
          SELECT sum(adjusted_gap) AS total_gap_duration_seconds
          FROM filtered_gaps
          GROUP BY id_t_well

    labels:
      - name: well_name
        columnName: well_name
      - name: well_id
        columnName: well_id
      - name: rig_name
        columnName: rig_name
      - name: database_name
        staticValue: id3_dashboard
    metrics:
      - name: total_gap_duration_seconds
        type: GAUGE
        help: "The total sensors gap duration in seconds"
        column: total_gap_duration_seconds
