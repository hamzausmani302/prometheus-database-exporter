name: End To End Test Exporter
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
        description: the commit to run the pipeline on
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
        description: the commit to run the pipeline on

jobs:
  container-job:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      db:
        env:
          POSTGRES_PASSWORD: postgres
        image: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
        ref: ${{ inputs.ref }}
        persist-credentials: true

    - name: Setup go
      uses: actions/setup-go@v6.0.0
      with:
        go-version: "1.24"

    - name: Install postgresql-client
      run: sudo apt-get install -y postgresql-client

    - name: Wait for Postgres (extra safety)
      run: |
        echo "Waiting for Postgres service to be ready..."
        for i in {1..10}; do
          if pg_isready -h localhost -p 5432 -U postgres; then
            echo "Postgres is ready!"
            exit 0
          fi
          echo "Waiting..."
          sleep 3
        done
        echo "Postgres did not become ready in time" >&2
        exit 1

    - name: Init database
      env:
        PGPASSWORD: password
      run: |
        psql -U postgres -h localhost -p 5432 -c "CREATE DATABASE exporter"
        psql -U postgres -h localhost -p 5432 -d exporter -a -f ./test/sql/datasource-test/setup-dummy-data-postgres.sql

    - name: Test integration
      env:
        CONFIG_FILE_PATH: "config/config.test.yaml"
      run: |
        git submodule update --init --recursive
        go mod tidy
        cd test/e2e
        go test -tags=e2e e2e_test.go
